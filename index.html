<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Choicez</title>
  
</head>

<body>
  <h1>Best Choices with <q>Awesom Searches</q></h1>
<input type="text" id= "bar" placeholder ="Search Awesome">

  <button id = "btn">🔍</button>
  <div id ="box"></div>
  
<link rel="stylesheet" href="Style.css">
  
  <script>
    
let products = [{
   "name" : "Meta Ray-Ban ",
  "caption" : "xyz",
  "note" : "xxx",
  "price" : "5X,XXX",
  "link" : "https://link.amazon/B0bdgtS5P"
 }];
const bar = document.getElementById("bar")

const btn = document.getElementById("btn")

const box = document.getElementById("box")

btn.addEventListener("click", function(){
 
 let text = bar.value.toLowerCase().trim()
   box.innerHTML="";
  
products.forEach(function(product){
  
if (text&&
  product.name.toLowerCase().includes(text)
) {
     
  let show = document.createElement("div")
  
show.innerHTML =
  "<h1>" + product.name + "</h1>" +
  "<p>" + product.caption + "</p>" +
  "<p>" + product.note + "</p>" +
  "<p>" + product.price + "</p>" + 
  "<a href =" + product.link + "> view Link  </a>";
  
  box.appendChild(show);
  
   
   
   }   
}   

)
  
})

  </script>
</body>

</html>
